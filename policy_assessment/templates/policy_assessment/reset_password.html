{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        /* Colors extracted from the image (Same as Login & Forgot Password Pages) */
        :root {
            --primary-color: #f4f4f4; /* Light gray background */
            --secondary-color: #e8e8e8; /* Slightly darker gray */
            --text-color: #333; /* Dark gray for contrast */
            --button-color: #444; /* Darker button */
            --button-hover: #222; /* Even darker on hover */
        }

        body {
            background-color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .form-container {
            background: var(--secondary-color);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }

        .form-container h2 {
            color: var(--text-color);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: 600;
            color: var(--text-color);
        }

        .form-control {
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .btn-primary {
            width: 100%;
            margin-top: 15px;
            background-color: var(--button-color);
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--button-hover);
        }

        .text-center a {
            text-decoration: none;
            color: var(--text-color);
            font-weight: 500;
        }

        .text-center a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }

        .success-message {
            color: green;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Reset Password</h2>

        {% if valid %}
            <form method="POST">
                {% csrf_token %}
                
                <div class="form-group text-start">
                    <label for="password">New Password:</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>

                <div class="form-group text-start mt-2">
                    <label for="confirm_password">Confirm Password:</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-primary">Reset Password</button>
            </form>
        {% else %}
            <p class="error-message">Invalid or expired reset link.</p>
            <div class="text-center mt-3">
                <a href="{% url 'forgot_password' %}" class="btn btn-secondary">Request a new password reset</a>
            </div>
        {% endif %}
    </div>

</body>
</html>
