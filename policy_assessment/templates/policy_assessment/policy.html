{% extends 'policy_assessment/base.html' %}
{% block content %}
<h2 class="mb-4">Company Policy Documents</h2>
<ul class="list-group">
    {% for doc in documents %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            <span>{{ doc.name }}</span>
            <div>
                <a href="{% url 'view_policy' doc.name %}" class="btn btn-sm btn-primary me-2" target="_blank">View</a>
                
            </div>
        </li>
    {% empty %}
        <li class="list-group-item text-center">No policy documents available.</li>
    {% endfor %}
</ul>
{% endblock %}
